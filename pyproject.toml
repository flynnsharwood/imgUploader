[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imguploader"
dynamic = ["version"]
description = "Bulk-upload folders of images to imgchest and cache the links in PostgreSQL for pixBoards"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["pyyaml", "requests", "psycopg2-binary", "python-dotenv"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
imguploader = "imguploader.cli:main"

[tool.setuptools]
packages = ["imguploader"]

[tool.setuptools.dynamic]
version = { attr = "imguploader.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
